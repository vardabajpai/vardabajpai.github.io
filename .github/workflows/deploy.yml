name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *' # daily: import new Substack posts, rebuild

permissions:
  contents: write # lets the job commit imported Substack posts
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import new Substack posts
        run: npm run import:substack
        continue-on-error: true # never block a deploy because Substack is down
      - name: Commit imported posts
        run: |
          if [ -n "$(git status --porcelain src/content/essays)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/essays
            git commit -m "Import new Substack posts"
            git push
          fi
      - uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
